<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found</title>
</head>
<body>
  <header>
    <h1>Oops! Page Not Found</h1>
    <p>Sorry, we couldn't find the page you were looking for.</p>
    <a href="/">Go back to the homepage</a>
  </header>

  <script>
    const wordToReplace = "/pycub/";
    const replacementWord = "/pyCub/";
    let currentUrl = window.location.href;

    const hasTrailingSlash = currentUrl.endsWith('/');
    // Check if the URL does not end with a slash "/"
    if (!hasTrailingSlash) {
      // Add a trailing slash if it's missing
      currentUrl += '/';
    }

    // Check if the current URL contains the word "/pycub/"
    if (currentUrl.includes(wordToReplace)) {
      // Replace "/pycub/" with "/pyCub/"
      let newUrl = currentUrl.replace(wordToReplace, replacementWord);

       if (!hasTrailingSlash)  {
          newUrl = newUrl.slice(0, -1);
       }
      // Redirect to the new URL
      window.location.href = newUrl;
    }

  </script>
</body>
</html>
