<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0;url=/pyCub">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // Get the current path (everything after the domain)
        var currentPath = window.location.pathname;

        // Check if the path starts with '/pycub' (case-sensitive)
        if (currentPath.startsWith('/pycub')) {
            // Replace '/pycub' with '/pyCub' to form the new path
            var newPath = currentPath.replace('/pycub', '/pyCub');
            // Redirect to the new path
            window.location.href = newPath;
        }
    </script>
</head>
<body>
    <p>If you are not redirected, <a href="/pyCub">click here</a>.</p>
</body>
</html>
