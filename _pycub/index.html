<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // Get the current path from the URL
        var currentPath = window.location.pathname;

        // Replace '/pycub' with '/pyCub' to create the new path
        var newPath = currentPath.replace('/pycub', '/pyCub');

        // Redirect to the new path
        window.location.href = newPath;
    </script>
</head>
<body>
    <p>If you are not redirected, <a href="/pyCub">click here</a>.</p>
</body>
</html>
