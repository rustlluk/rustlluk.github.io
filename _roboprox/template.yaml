# This structure is in YAML format. You only need to fill in the values on rows **without** # - those are comments
# Each record is preceded with key:, such as PUBLISHER:. Your data follows in a presented form.
# Each colon : needs to be followed by space
# Text values need to be put between quotation marks; see TYP_LICENCE
# Records within {} and [] brackets need to be separated with comma and space; see GROUP
# Check the correctness of the format here https://jsonformatter.org/yaml-validator
#
# Publisher - please fill directly into the note, cannot be retrieved from V3S directly
PUBLISHER: "Elsevier B.V."
# Select Q1AISorSJR if journal paper ranks in Q1 of WOS AIS or SJR, Q2AISorSJR if Q2 of WOS AIS or SJR, ConfA if the conference ranks in CORE A/A* or Qualis A1/A2 or ERA A, else NONE
RANKS: "Q1AISorSJR"
# Write two sentences. The first sentence (at most 200 characters in English) highlights the result.
# The first sentence will also be used by PR on LinkedIn when VYBRAT_Z_Q1AISorSJR_Q2AISorSJR_ConfA_NONE is not NONE
# The second sentence (at most 200 characters in English) describes a connection to research objective RO x.y,
VECNA_NAVAZNOST_NA_ROBOPROX: "The paper showcases the power of continuum multi-physics modeling in understanding and predicting corrosion processes that initiate at the atomistic scale. In this regard, it connects the modeling and simulation activities in RA4 and RA5 (particularly RO 4.1 – Simulations with RO 5.3 – Design and manipulation of 2D materials)."
# Contact researcher’s email associated with the result
CONTACT_PERSON_EMAIL: " ….@cvut.cz"
# The researcher decides a share of the result among Roboprox Groups, e.g., { G11: 80, G12: 20 } means group G11 participated 80 % and G12 20 %
GROUPS_AND_THEIR_PERCENTAGE: { G04: 100 }
#  The researcher decides a share of the result among Roboprox Milestones, e.g., { 11.1.1: 60, 11.1.3: 40 }, means milestone 11.1.1 of RO 11.1 in the project proposal participated 60 %. (In special cases, when there is a result which does not belong to any planned milestone, you might use { 11.1.NEW: 100 }, RO11.1. participated 100 %.)
MILESTONES_AND_THEIR_PERCENTAGE: { 4.1.1: 80, 5.3.1: 20 }
# Fill the grade when awarded in Metodika17+, otherwise NONE
GRADE_METODIKA_17: "NONE"
# Acceptance date - when the review process was finished with a positive result.
DATUM_DOSAZENI: "20.8.2024"
# When the result has several OP JAK or OP VVV projects in acknowledgments, then indicate the percentage of the result for ROBOPROX, otherwise 100
POMERNA_CAST_PRO_ROBOPROX: 100
# List of codes (e.g., ["ABCD", "EFGH"]) of the other relevant OP JAK and OP VVV projects
REGISTRACNI_CISLA_OSTATNICH_PROJEKTU: []
# Open access DOI or persistent URL (e.g., arxiv) of the accepted version
TRVALA_URL_OPEN_ACCESS_ACCEPTED: "https://dspace.cvut.cz/handle/10467/118564"
# License, select: CC-BY / CC-BY-ND / CC-BY-NC / CC-BY-NC-ND, JINA otherwise
TYP_LICENCE: "CC-BY"
# Type of the open access - fill in either preprint, or pre-registration
VCASNE_SDILENI_VYSLEDKU_TYP: "preprint"
# Open access persistent URL (e.g., arxiv) of the preprint or pre-registration, of the submitted version of the result, OR if not relevant, fill in 'NR'
TRVALA_URL_OPEN_ACCESS_PREPRINT: "https://doi.org/10.48550/arXiv.2409.05889"
# Persistent URL of the open peer review process if it applies, OR if not relevant, fill in 'NR'
PERSISTENTNI_OTEVRENE_RECENZNI_RIZENI: "NR"
# DOI or persistent URL for the uploaded research data
PERZISTENTNI_IDENTIFIKATOR_MISTA_ULOZENI_DAT: "No data was used for the research described in the article."
# Describe citizen science (how The public, end-users, academia and industry, public authorities, non-profit organisations, etc. were involved in the research), OR if not relevant, fill in 'NR'
CITIZEN_SCIENCE: "NR"
# What RICAIP project equipment was used to achieve the result (robot, testbed, software, etc), or NR if not relevant
RICAIP_EQUIPMENT: "NR"
